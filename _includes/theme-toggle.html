<button
  type="button"
  id="theme-toggle"
  class="theme-toggle"
  aria-pressed="false"
  data-label-to-dark-en="Switch to dark mode"
  data-label-to-dark-zh="切换到深色模式"
  data-label-to-light-en="Switch to light mode"
  data-label-to-light-zh="切换到浅色模式"
  aria-label="Switch to dark mode">
  <i class="fas fa-moon theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"></i>
  <i class="fas fa-sun theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"></i>
</button>
